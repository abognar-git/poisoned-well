name: refresh-data

# Re-fetches the live Pravda-network feed, re-derives, re-validates, regenerates the
# figures, and commits only if the data changed.
#
# Runs hourly, matching CheckFirst's upstream cadence. The repository is public, so
# Actions minutes are unmetered; this was briefly manual-only while it was private,
# where ~720 scheduled runs a month would have drawn on the account quota.
#
# Each run commits to main, which also rebuilds the GitHub Pages site — so the live
# page tracks the feed rather than freezing at whatever was committed by hand.
# If the quota ever matters again, "17 */6 * * *" is roughly 120 runs a month.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch upstream data
        run: |
          python scripts/fetch_pravda.py
          python scripts/fetch_frameworks.py

      - name: Derive summaries
        run: python scripts/derive_summaries.py

      - name: Derive the analyses that read raw per-mirror data
        run: |
          python scripts/build_network.py
          python scripts/derive_clock.py
          python scripts/derive_peer_control.py
          python scripts/derive_convergence.py

      - name: Capture live specimens (non-fatal if the mirror is unreachable)
        continue-on-error: true
        run: python scripts/capture_specimens.py

      - name: Derive the source-diet analysis (needs the fresh capture)
        run: |
          python scripts/derive_diet.py
          python scripts/make_figures.py

      # Re-measure the dead fake-outlet domains: if one is re-registered, check_claims
      # fails rather than letting the page keep asserting it is gone.
      # Every capture used to be overwritten by the next one. Accumulate instead: this is
      # the only material here that nobody else publishes.
      - name: Archive the capture
        run: python scripts/archive_specimens.py

      # Coverage is computed from the capture log, so it can only be recomputed here.
      - name: Recompute sampling coverage
        run: python scripts/derive_frame.py

      # NOT rebuilt here. The credit graph needs the full 101-domain manifest (~49 MB),
      # and this job fetches only the seven regional mirrors — running it here republished
      # a seven-mirror panel over the hundred-and-one-mirror one. It has its own daily
      # workflow; the script now also refuses to shrink the published panel.

      - name: Re-check the documented fake-outlet domains
        run: python scripts/check_domains.py
        continue-on-error: true

      - name: Validate catalog
        run: python scripts/check_catalog.py

      - name: Validate claims
        run: python scripts/check_claims.py

      # Census figures that move every time the mirror publishes are restated in prose in
      # several documents, so they are synced from the fresh data and committed with it
      # rather than left to rot or hand-edited hourly. --sync only rewrites figures
      # registered in CLAIMS; a fragment that stops appearing, one that appears twice, or
      # a correction that stops being cited still fails — which is why the plain check
      # runs straight afterwards.
      - name: Sync the registered figures to the new data
        run: python scripts/check_readme.py --sync

      - name: Verify they still hold
        run: python scripts/check_readme.py

      - name: Commit refreshed data
        run: |
          git config user.name "poisoned-well data refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived data/archive data/panel docs/figures \
                  README.md RESEARCH.md catalog/claims.json site/prototype/index.html
          if git diff --cached --stat --exit-code; then
            echo "No data changes."
          else
            git commit -m "data: scheduled refresh"
          fi
          # --sync writes wherever a registered fragment lives, and this add list is a
          # hand-maintained subset of that. When the two drifted apart, the job synced
          # four files, committed one, and pushed a tree that fails its own gate — and
          # nothing caught it, because a GITHUB_TOKEN push does not trigger validate.yml.
          # A dirty tree here means --sync touched a path nobody added.
          if ! git diff --quiet; then
            echo "::error::check_readme.py --sync modified tracked files that this job "\
                 "does not commit. Add them to the git add list above:"
            git diff --name-only
            exit 1
          fi
          git push
