name: refresh-data

# Keeps data/derived/ tracking the live Pravda-network feed (upstream updates hourly).
# Every 6 hours: re-fetch, re-derive, re-validate, commit only if the data changed.
# The commit history doubles as a monitoring log of the ongoing campaign.

on:
  schedule:
    - cron: "17 * * * *"   # hourly, matching CheckFirst's upstream cadence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch upstream data
        run: |
          python scripts/fetch_pravda.py
          python scripts/fetch_frameworks.py

      - name: Derive summaries
        run: python scripts/derive_summaries.py

      - name: Derive the analyses that read raw per-mirror data
        run: |
          python scripts/build_network.py
          python scripts/derive_clock.py
          python scripts/derive_peer_control.py
          python scripts/derive_convergence.py

      - name: Capture live specimens (non-fatal if the mirror is unreachable)
        continue-on-error: true
        run: python scripts/capture_specimens.py

      - name: Derive the source-diet analysis (needs the fresh capture)
        run: |
          python scripts/derive_diet.py
          python scripts/make_figures.py

      - name: Validate catalog
        run: python scripts/check_catalog.py

      - name: Validate claims
        run: python scripts/check_claims.py

      # The README quotes census figures that move as the mirror publishes. This runs
      # after validation but before the commit step below only in file order — it is a
      # report, not a blocker: fresh data still lands, and a red run says the write-up
      # now disagrees with the data underneath it.
      - name: Report if the README has gone stale against the new data
        run: python scripts/check_readme.py
        continue-on-error: true

      - name: Commit refreshed data
        run: |
          git config user.name "poisoned-well data refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived docs/figures
          if git diff --cached --stat --exit-code; then
            echo "No data changes."
          else
            git commit -m "data: scheduled refresh"
            git push
          fi
