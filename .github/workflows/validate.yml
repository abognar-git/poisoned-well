name: validate

# The gates that were previously only reachable from the scheduled refresh — which
# cannot run without a remote, and so had never run at all. Every push and every pull
# request now re-derives from committed data and fails on:
#   * a catalog entry missing required fields, enums or sources
#   * a rendered data-claim with no backing in the registry
#   * a catalog URL pointing at propaganda infrastructure
#   * a regression in the personal-smear filter
#   * a derived file that does not match what the scripts produce from the catalog
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone: check_claims.py verifies that every
      # commit a correction cites is still reachable, and a depth-1 checkout cannot see
      # any of them. The repo is 116 commits; the cost is nil.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog (includes the smear-filter fixtures)
        run: python scripts/check_catalog.py

      - name: Validate claims, blocklist and page references
        run: python scripts/check_claims.py

      - name: Verify the README against the data it describes
        run: python scripts/check_readme.py

      # Only generators whose inputs are committed belong here. derive_convergence and
      # derive_peer_control read data/raw, which is gitignored and updates upstream
      # every hour, so re-running them on a checkout compares a live census against a
      # committed one and drifts by design. Keeping them out is what refresh-data.yml
      # is for: it fetches, re-derives, validates and commits together.
      # The graph's node and link sets come from the catalog and must not drift. Its
      # layout coordinates come from 600 iterations of a chaotic force simulation and
      # are not reproducible bit-for-bit across architectures, so --check compares the
      # structure and leaves the coordinates alone.
      - name: Check the network graph against the catalog
        run: python scripts/build_network.py --check

      - name: Re-derive everything whose inputs are committed and byte-stable
        run: |
          python scripts/derive_research.py    # RESEARCH.md -> the site's research layer
          python scripts/make_figures.py       # data/derived -> the README figures

      # research.json is parsed from RESEARCH.md, and the figures are drawn from
      # data/derived. If either drifts, the site shows corrections and charts that
      # nobody can regenerate — which is the failure this project already had once.
      - name: Fail if committed derived data or figures drifted from their generators
        run: |
          if ! git diff --stat --exit-code -- data/derived docs/figures; then
            echo "::error::data/derived or docs/figures is out of date — re-run the derive scripts and commit"
            git diff -- data/derived docs/figures | head -60
            exit 1
          fi
