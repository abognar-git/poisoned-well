name: rebuild-panel

# The credit graph needs the full 101-domain manifest (~49 MB), which is too much to pull
# hourly and unkind to the upstream that hosts it. Source totals move slowly, so once a day
# is ample. The hourly refresh deliberately does NOT touch data/panel.

on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the full manifest
        run: python scripts/fetch_pravda.py --all --delay 0.4

      - name: Rebuild the credit graph
        run: python scripts/derive_feeder_index.py

      - name: Commit the panel
        run: |
          git config user.name "poisoned-well panel rebuild"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/panel
          if git diff --cached --stat --exit-code; then
            echo "No panel changes."
          else
            git commit -m "data: daily panel rebuild"
            git push
          fi
